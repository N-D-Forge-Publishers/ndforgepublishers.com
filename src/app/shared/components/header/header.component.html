<header class="site-header">
  <div class="wrap site-header__row">
    <a class="wordmark" routerLink="/" (click)="closeMenu()">
      <span class="wordmark__mark">N&D FORGE</span>
      <span class="wordmark__sub">Publishers</span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen()">
      <a routerLink="/" fragment="catalog" routerLinkActive="is-active" (click)="closeMenu()">Catalog</a>
      <a routerLink="/about" routerLinkActive="is-active" (click)="closeMenu()">About</a>
      <a routerLink="/contact" routerLinkActive="is-active" (click)="closeMenu()">Contact</a>
      <a class="btn btn--primary nav__cta" routerLink="/contact" fragment="submissions" (click)="closeMenu()">
        Submit a manuscript
      </a>
    </nav>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      aria-label="Toggle menu"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
